[project]
name = "Kateto"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["torch", "torchaudio>=2.11.0", "triton-rocm"]

[tool.uv.workspace]
members = [
  "apps/classifier",
  "apps/orchestator",
  "apps/tts",
  "apps/protos",
  "apps/protos/*",
]
exclude = ["apps/protos/node_modules", "apps/protos/__pycache__"]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
torchaudio = { index = "pytorch-rocm" }
triton-rocm = { index = "pytorch-rocm" }
