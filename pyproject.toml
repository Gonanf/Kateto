[project]
name = "hipotenusa"
version = "0.1.0"
description = "Hipotenusa MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.0.0",
    "cliff>=4.15.0",
    "croniter>=6.2.4",
    "edge-tts>=7.0.0",
    "fastapi==0.140.0",
    "httpx==0.28.1",
    "loguru>=0.7.3",
    "mcp==1.28.1",
    "numpy>=2.5.1",
    "openai==2.45.0",
    "pydantic==2.13.4",
    "pydantic-ai>=2.18.0",
    "pydantic-ai-harness[codemode,dynamic-workflow,skills]>=0.11.0",
    "python-dotenv==1.2.2",
    "silero-vad<6.2",
    "sounddevice==0.5.5",
    "torch>=2.13.0",
    "uvicorn==0.51.0",
    "watchfiles>=1.2.0",
    "zodb>=6.3",
]

[project.optional-dependencies]
classifier = [
    "huggingface-hub>=0.27.0",
    "onnxruntime>=1.20.0",
    "tokenizers>=0.21.0",
]
whispercpp = [
    "pywhispercpp>=1.5.0",
]
llamacpp = [
    "llama-cpp-python>=0.3.0",
]
piper = [
    "piper-tts>=1.6.0",
]
phonon = [
    "ptts>=0.7.0",
]
all = [
    "hipotenusa[classifier,llamacpp,whispercpp,piper,phonon]",
]

[project.scripts]
hipotenusa = "hipotenusa.__main__:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["hipotenusa/tests"]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
