[project]
name = "Kateto"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "torch",
  "torchaudio>=2.11.0",
  "triton-rocm",
  "pytorch-triton-rocm>=3.5.1; sys_platform == 'linux'",
  "flash-attn>=2.5.0",

]

[tool.uv.workspace]
members = [
  "apps/classifier",
  "apps/orchestator",
  "apps/tts",
  "packages/protos",
  "packages/protos/*",
  "apps/lang_manager",
  "apps/manager",
  "packages/data",
  "packages/i_have_time",
]
exclude = ["**/node_modules", "**/__pycache__"]

[tool.uv]
index-strategy = "unsafe-best-match"
no-build-isolation-package = ["flash-attn", "setuptools"]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
torchaudio = { index = "pytorch-rocm" }
pytorch-triton-rocm = [
  { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
triton-rocm = { index = "pytorch-rocm" }
flash-attn = { git = "https://github.com/Dao-AILab/flash-attention", tag = "v2.8.3" }

[tool.uv.extra-build-dependencies]
flash-attn = ["setuptools"]


[tool.pyright]
venvPath = "./"
venv = ".venv"
