[runtime]
host = "0.0.0.0"
port = 8099
token = "hannya-lan-dev"

[runtime.overrides]
"plugin.audio_input_mic.enabled" = false
"plugin.audio_output_player.enabled" = true  # el escritorio habla directo por PipeWire (OBS lo captura); el navegador ya no reproduce audio
# edgetts (Microsoft, 403) manda un final vacio que cierra el turno antes que piper
"plugin.audio_output_edgetts.enabled" = false
"plugin.audio_processor_parakeet.port" = 8094
# Diarización: etiqueta cada turno como owner/other con un embedding de voz local
# (ERes2Net ONNX, CPU). El primer hablante que aparece queda como dueño.
"plugin.audio_processor_parakeet.speaker_id" = true
# Vision: consumidor de los frames que manda el celular por /ws/mask. Sin esta
# seccion el evento vision_frame no tiene quien lo lea y la camara es decorativa.
"plugin.executor_vision.enabled" = true
"plugin.executor_vision.vision_endpoint" = "http://127.0.0.1:11434/v1"
"plugin.executor_vision.vision_model" = "LFM3-Omni-2B"
# Los frames del celu llegan por /ws/mask con source="mask"; el default es "screen",
# asi el describe periodico miraba una fuente vacia.
"plugin.executor_vision.source_default" = "mask"

# Vision periodica: la voz mira la camara cada 2-5 min (intervalo aleatorio) y
# comenta lo que ve. Sin vision_periodic=true el plugin queda idle.
"voice.dionisio.vision_periodic" = true
"voice.dionisio.vision_interval_min" = "120s"
"voice.dionisio.vision_interval_max" = "300s"
"voice.dionisio.thinking" = false
"voice.truman.thinking" = false
"voice.elgarca.thinking" = false
"voice.elchacal.thinking" = false
"voice.pagliacci.thinking" = false
# El LLM NO es sidecar: lo sirve el router llama.cpp de :11434.
"plugin.voice_llm.endpoint" = "http://127.0.0.1:11434/v1"
"plugin.voice_llm.model" = "Pollux-E2B"  # roleplay tune de gemma-4-E2B (coleccion Gonanf/roleplay)

# Clasificador de fin de turno: etapa2=base no es servible (falta el ONNX del
# encoder preentrenado) y el gate queda fail-open, que es como funcionaba bien.
# NO usar etapa2=ft: esa cabeza suprime todos los turnos del usuario.
"plugin.eot_gate.etapa2" = "base"
# 1.0s (default) no alcanza para el primer forward del distilbert en CPU: el gate
# moria por timeout y reiniciaba el clasificador en cada turno.
"plugin.eot_gate.timeout" = 3.0

# Hipotenusa es entretenimiento/roleplay: nada de trabajo ni planificacion.
"plugin.executor_workflow_router.enabled" = false
"plugin.executor_todo_list.enabled" = false
"plugin.backlog.enabled" = false
"plugin.executor_scheduler.enabled" = true
"plugin.workflow_engine.enabled" = false

# Modo personaje: el system prompt es SOLO esto (sin soul, skills, tools ni memoria).





# Personajes: descripcion + 3 ejemplos reales del TSV de personajes (few-shot).
# Reversible: borra este bloque y vuelve al soul de cada voz.

# Thinking por request (extra_body.reasoning_effort): none, no reasoning-budget en el router.
# Modelo por agente (probado: apuntando jane a LFM3 el router cargo LFM3-1.7B).
# Descomentar una linea = esa voz usa otro preset; sin lineas, todas van al global.
# Cada modelo distinto cuesta un swap del router (~10 s) la primera vez que habla.
# "voice.doktor.model" = "LFM3-1.7B"

# ASR: crispasr lo levanta este runtime como subproceso. Si ya esta sano, lo adopta.
[[sidecar]]
name = "asr"
adopt_if_healthy = true
required = true
health_url = "http://127.0.0.1:8094/health"
health_expect = "parakeet"
argv = ["/run/media/chaos/secundario/proyectos/crispasr/crispasr-linux-x86_64-vulkan/crispasr",
        "--server", "--host", "0.0.0.0", "--port", "8094",
        "-m", "/run/media/chaos/secundario/proyectos/redux-gguf/models/parakeet-ultra-q8_0.gguf",
        "--backend", "parakeet", "-l", "es",
        "-di", "--diarize-method", "sortformer",
        "--gpu-backend", "vulkan", "-dev", "1"]
ready_timeout_s = 120

[[expose]]
name = "asr-lan"
listen = "0.0.0.0:8096"
target = "127.0.0.1:8094"
health_url = "http://127.0.0.1:8094/health"
health_expect = "parakeet"
required = true

# Personajes del TSV: las voces viven en ~/.config/kateto/voices/<nombre>/ con su
# SOUL (descripcion + 3 ejemplos reales). Los nombres legacy quedaron apagados.
