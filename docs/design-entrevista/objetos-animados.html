<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Objetos animados · Oficina</title><style>
:root{--wood:#7a4b2a;--paper:#f3e7c9;--olive:#4a5d3a;--night:#101820;--light:#ffd08a}*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#d5c6a7;color:var(--night);font-family:Georgia,'Times New Roman',serif}.page{width:1920px;height:1080px;padding:54px 82px;background:radial-gradient(ellipse at 54% 0%,#e8d9b9,#c4b292 75%)}h1{margin:0 0 8px;font-size:46px;letter-spacing:.01em}p{margin:0 0 34px;font-size:21px;color:#514636}.grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:24px;height:878px}.tile{position:relative;overflow:hidden;background:#eaddc0;border:1px solid #af9d7a;box-shadow:0 9px 22px #34261716}.tile h2{position:absolute;z-index:2;left:26px;top:20px;margin:0;font-size:24px;font-weight:600;letter-spacing:.06em;color:#42372a}.tile svg{width:100%;height:100%}.door-rot{transform-origin:225px 198px;animation:door 5s ease-in-out infinite}.chair{animation:chair 4s ease-in-out infinite}.lamp-glow{animation:lamp 5s ease-in-out infinite}.water{transform-box:fill-box;transform-origin:center;animation:wave 2s ease-in-out infinite alternate}.paper{animation:slide 4s ease-in-out infinite}.sign{animation:sign 4s ease-in-out infinite}@keyframes door{0%,12%{transform:perspective(700px) rotateY(0)}40%,65%{transform:perspective(700px) rotateY(-48deg)}88%,100%{transform:perspective(700px) rotateY(0)}}@keyframes chair{0%,15%{transform:translateX(0)}38%,60%{transform:translateX(75px)}82%,100%{transform:translateX(0)}}@keyframes lamp{0%,22%,80%,100%{opacity:.1}32%,65%{opacity:.85}}@keyframes wave{from{transform:skewX(-7deg) translateX(-3px)}to{transform:skewX(8deg) translateX(4px)}}@keyframes slide{0%,15%{transform:translateX(0) rotate(0)}44%,63%{transform:translateX(96px) rotate(5deg)}88%,100%{transform:translateX(0) rotate(0)}}@keyframes sign{0%,24%,90%,100%{opacity:.18}34%,82%{opacity:1}}
</style></head><body><main class="page"><!-- IDs base documentados: #bg-door, #fg-paper. Objetos en tiles con data-anim. --><h1>Objetos de la oficina</h1><p>Animaciones vectoriales en ciclo continuo · paleta de entrevista</p><section class="grid">
