[project]
name = "manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "asyncio>=4.0.0",
  "fastmcp>=3.2.4",
  "grpcio>=1.80.0",
  "grpcio-tools>=1.80.0",
  "i_have_time",
  "langchain>=1.2.15",
  "langchain-openai>=1.2.1",
  "langgraph>=1.1.10",
  "manager-pb",
  "mdutils>=1.8.1",
  "op-client",
  "openproject-api-client>=0.2.0",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "pytest-fixtures>=0.1.0",
]

[tool.pyright]
venvPath = "../../"
venv = ".venv"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.uv.sources]
manager-pb = { workspace = true }
i-have-time = { workspace = true }
op-client = { workspace = true }
