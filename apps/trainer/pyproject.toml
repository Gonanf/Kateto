[project]
name = "trainer"
version = "0.1.0"
description = "Agent fine-tuning pipeline for Kateto Manager"
requires-python = ">=3.13"
dependencies = [
  "accelerate>=1.12.0",
  "datasets",
  "pandas>=3.0.2",
  "transformers",
  "torch>=2.11.0",
  "unsloth[amd]",
  "bitsandbytes>=0.49.2",
  "peft>=0.15.0",
  "trl",
  "pydantic>=2.0.0",
  "pyyaml>=6.0",
  "grpcio>=1.80.0",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "scikit-learn>=1.0.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"

[tool.uv.sources]
torch = { index = "pytorch-rocm" }

[tool.pyright]
venvPath = "../../"
venv = ".venv"
