models:
  classifier:
    base_model: distilbert-base-uncased
    bert_id2label:
      0: talk
      1: think
    bert_label2id:
      talk: 0
      think: 1
    bert_num_labels: 2
    dataset_name: classifier_data
    eval_steps: 100
    family: bert
    gradient_accumulation_steps: 8
    learning_rate: 0.0002
    llama_cpp_model_name: ''
    logging_steps: 10
    lora_alpha: 16
    lora_dropout: 0.0
    lora_r: 8
    max_seq_length: 512
    name: classifier
    num_train_epochs: 3
    optim: adamw_8bit
    per_device_train_batch_size: 8
    quant_method: q4_k_m
    role: classifier
    save_steps: 500
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    use_gradient_checkpointing: true
    warmup_steps: 10
