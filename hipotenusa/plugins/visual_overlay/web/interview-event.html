<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Hipotenusa · Entrevista (oficina)</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #101820; overflow: hidden;
    font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif; color: #f3e7c9; }
  #fit { position: fixed; inset: 0; display: grid; place-items: center; background: #0c1218; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden;
    transform-origin: center center; background: #1c2733; }
  #stage > iframe { position: absolute; inset: 0; width: 1920px; height: 1080px; border: 0;
    pointer-events: none; background: transparent; }
  #bg { z-index: 0; }
  #live { position: absolute; inset: 0; width: 1920px; height: 1080px; z-index: 2; }
  #fg { z-index: 3; }
  #cam { position: absolute; inset: 0; z-index: 1; }        /* capa de elenco: se mueve con la cámara */

  /* ---------- atmósfera ---------- */
  #vignette { position: absolute; inset: 0; z-index: 4; pointer-events: none;
    background:
      radial-gradient(ellipse at 52% 44%, rgba(0,0,0,0) 42%, rgba(6,10,14,.55) 100%),
      linear-gradient(180deg, rgba(6,10,14,.42) 0%, rgba(0,0,0,0) 26%, rgba(0,0,0,.34) 100%); }
  #bars { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
  #bars::before, #bars::after { content: ""; position: absolute; left: 0; right: 0; height: 42px;
    background: #06090d; }
  #bars::before { top: 0; } #bars::after { bottom: 0; }

  /* ---------- HUD ---------- */
  #hud { position: absolute; inset: 0; z-index: 7; pointer-events: none; }
  #tag { position: absolute; left: 58px; top: 64px; display: flex; gap: 14px; align-items: center;
    font-size: 15px; letter-spacing: .26em; text-transform: uppercase; opacity: .72; }
  #tag b { font-weight: 700; letter-spacing: .22em; }
  #rec { position: absolute; right: 58px; top: 64px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; letter-spacing: .2em; opacity: .8; font-variant-numeric: tabular-nums; }
  #rec i { width: 11px; height: 11px; border-radius: 50%; background: #e5544b; display: inline-block;
    animation: blink 1.6s steps(2,end) infinite; }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: .18; } }

  /* ---------- placa del candidato ---------- */
  #plate { position: absolute; left: 58px; bottom: 96px; min-width: 340px; padding: 16px 22px 16px 20px;
    background: rgba(8,12,17,.82); border: 1px solid rgba(243,231,201,.16); border-left: 4px solid #7dd3fc;
    border-radius: 6px; opacity: 0; transform: translateY(10px); transition: opacity .35s, transform .35s;
    backdrop-filter: blur(6px); }
  #plate.on { opacity: 1; transform: none; }
  #plate small { display: block; font-size: 12px; letter-spacing: .24em; opacity: .55; text-transform: uppercase; }
  #plate strong { font-family: Georgia, serif; font-size: 30px; letter-spacing: .02em; }
  #plate span { display: block; font-size: 14px; opacity: .6; margin-top: 2px; }

  /* ---------- tarjeta de pregunta ---------- */
  #qcard { position: absolute; left: 50%; top: 92px; width: 1180px; transform: translate(-50%, -14px);
    padding: 22px 28px; background: rgba(9,13,18,.88); border: 1px solid rgba(243,231,201,.14);
    border-top: 3px solid #7dd3fc; border-radius: 8px; opacity: 0; transition: opacity .3s, transform .3s;
    backdrop-filter: blur(8px); }
  #qcard.on { opacity: 1; transform: translate(-50%, 0); }
  #qcard .tag { font-size: 12px; letter-spacing: .3em; text-transform: uppercase; opacity: .5; }
  #qcard .txt { font-family: Georgia, serif; font-size: 38px; line-height: 1.22; margin-top: 8px; }

  /* ---------- subtítulos ---------- */
  #subs { position: absolute; left: 50%; bottom: 128px; transform: translateX(-50%); width: 1420px;
    text-align: center; opacity: 0; transition: opacity .18s; }
  #subs.on { opacity: 1; }
  #subs .who { font-size: 15px; letter-spacing: .26em; text-transform: uppercase; margin-bottom: 6px; }
  #subs .txt { display: inline-block; padding: 8px 18px; background: rgba(6,9,13,.72); border-radius: 4px;
    font-size: 32px; line-height: 1.28; font-family: Georgia, serif; }

  /* ---------- veredicto ---------- */
  #verdict { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0;
    transition: opacity .25s; background: radial-gradient(ellipse at 50% 50%, rgba(4,7,11,.55), rgba(4,7,11,.2)); }
  #verdict.on { opacity: 1; }
  #verdict .card { position: relative; padding: 34px 54px 30px; text-align: center;
    background: rgba(8,12,17,.92); border: 1px solid rgba(243,231,201,.2); border-radius: 10px;
    box-shadow: 0 24px 60px rgba(0,0,0,.55); transform: rotate(-1.2deg); }
  #verdict .stamp { font-size: 74px; font-family: Georgia, serif; letter-spacing: .08em; line-height: 1; }
  #verdict .score { margin-top: 10px; font-size: 22px; letter-spacing: .3em; opacity: .85;
    font-variant-numeric: tabular-nums; }
  #verdict .why { margin-top: 16px; font-size: 22px; opacity: .72; max-width: 820px; font-family: Georgia, serif; }
  #verdict.hired .stamp { color: #9be2a0; } #verdict.rejected .stamp { color: #f08b7f; }
  #meter { margin: 18px auto 0; width: 520px; height: 8px; background: rgba(243,231,201,.14); border-radius: 99px; }
  #meter i { display: block; height: 100%; width: 0; border-radius: 99px; background: #7dd3fc;
    transition: width 1.1s cubic-bezier(.2,.8,.2,1); }

  /* ---------- slate ---------- */
  #slate { position: absolute; inset: 0; z-index: 9; display: grid; place-items: center; text-align: center;
    background: #0a1016; opacity: 1; transition: opacity .6s; }
  #slate.off { opacity: 0; pointer-events: none; }
  #slate .kicker { font-size: 16px; letter-spacing: .42em; text-transform: uppercase; opacity: .5; }
  #slate h1 { font-family: Georgia, serif; font-size: 86px; letter-spacing: .02em; margin: 18px 0 10px; }
  #slate p { font-size: 26px; opacity: .74; margin: 0; }
  #slate footer { position: absolute; bottom: 110px; left: 0; right: 0; font-size: 15px;
    letter-spacing: .3em; text-transform: uppercase; opacity: .45; }
  #loading { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center;
    background: #0a1016; font-size: 15px; letter-spacing: .3em; text-transform: uppercase; opacity: .8; }
  #loading.off { display: none; }
  /* marca de sincronización: un frame blanco al arrancar el evento. El renderer lo detecta
     para recortar el pre-roll de la captura y alinear el audio con el video. */
  #flash { position: absolute; inset: 0; z-index: 11; background: #fff; opacity: 0; pointer-events: none; }
  #flash.on { opacity: 1; }
</style>
</head>
<body>
<div id="fit">
  <div id="stage">
    <iframe id="bg" title="oficina" src="./entrevista/oficina-fondo.html?v=2" scrolling="no"></iframe>
    <canvas id="live"></canvas>
    <iframe id="fg" title="escritorio" src="./entrevista/oficina-primer-plano.html" scrolling="no"></iframe>
    <div id="vignette"></div>

    <div id="hud">
      <div id="tag"><b>OFICINA 3B</b><span>entrevista en curso</span></div>
      <div id="rec"><i></i><span id="tc">00:00</span></div>
      <div id="plate" style="--accent:#7dd3fc"><small>candidato</small><strong id="pname">—</strong><span id="prole"></span></div>
      <div id="qcard"><div class="tag">pregunta</div><div class="txt" id="qtext">—</div></div>
      <div id="subs"><div class="who" id="swho"></div><div class="txt" id="stext"></div></div>
      <div id="verdict">
        <div class="card">
          <div class="stamp" id="vstamp">—</div>
          <div class="score" id="vscore">0 / 100</div>
          <div id="meter"><i></i></div>
          <div class="why" id="vwhy"></div>
        </div>
      </div>
    </div>

    <div id="bars"></div>

    <div id="slate">
      <div class="kicker" id="sl-kicker">Hipotenusa Labs presenta</div>
      <h1 id="sl-title">ENTREVISTA DE TRABAJO</h1>
      <p id="sl-sub">4 agentes · 1 puesto</p>
      <footer id="sl-foot">Oficina 3B · Hipotenusa Labs</footer>
    </div>
    <div id="loading">cargando elenco…</div>
    <div id="flash"></div>
  </div>
</div>

<script src="/media/vendor/live2d/live2dcubismcore.min.js"></script>
<script src="/media/vendor/live2d/pixi.min.js"></script>
<script src="/media/vendor/live2d/pixi-live2d-display-cubism4.min.js"></script>
<script>
"use strict";

/* ============================================================================
   Escena del evento de entrevista.
   El tiempo lo manda el guion (assets/entrevista/guion.json): cada cue trae un `t`
   absoluto en segundos. La página no decide nada por su cuenta — sólo dibuja el
   estado correspondiente a `t`. Eso es lo que permite mezclar el audio aparte y
   que las dos piezas coincidan.
   ========================================================================= */

const STAGE_W = 1920, STAGE_H = 1080;
const SEAT = { x: 1450, y: 1090, h: 900 };  // sentado a la derecha del laptop, base bajo el escritorio
const WALK_LIFT = 90;                     // de pie camina 90px más arriba que sentado
const HOSTS = { teto: { x: 352, h: 585 } };
const DOOR_X = 205;                       // en el vano de la puerta, izquierda del cuadro

const stage = document.getElementById('stage');
const el = (id) => document.getElementById(id);
let guion = null;
let app = null;
let t0 = null;
let cursor = 0;
const models = {};      // id -> { model, base, anim }
const state = { active: null, question: false, verdictUntil: 0, done: false };

// ---------- escalado al viewport (en la grabación es 1:1) ----------
function fit() {
  const s = Math.min(innerWidth / STAGE_W, innerHeight / STAGE_H);
  stage.style.transform = `scale(${s})`;
}
addEventListener('resize', fit); fit();

// ---------- capa de fondo: puerta ----------
const bgFrame = el('bg');
const fgFrame = el('fg');
function door(open) {
  let doc = null;
  try { doc = bgFrame.contentDocument; } catch (e) { doc = null; }
  const g = doc && doc.getElementById('bg-door');
  if (!g) return;
  // El arte trae la puerta cerrada. Para que el movimiento se lea como "abrir", inyectamos
  // el vano oscuro detrás y giramos la hoja sobre su bisagra izquierda.
  let hole = doc.getElementById('doorway');
  if (!hole) {
    hole = doc.createElementNS('http://www.w3.org/2000/svg', 'g');
    hole.id = 'doorway';
    hole.innerHTML = '<rect x="112" y="215" width="262" height="539" fill="#0d0a08"/>' +
      '<rect x="112" y="215" width="262" height="120" fill="#2a2118" opacity=".7"/>' +
      '<rect x="112" y="215" width="26" height="539" fill="#241a12" opacity=".85"/>';
  }
  // SVG sólo tiene transform 2D: perspective()/rotateY() no existen y el navegador
  // deforma el grupo entero con un punto de fuga inventado. Además las bisagras
  // están a la DERECHA (x≈374), así que girar el grupo desde la izquierda movía
  // el marco junto con la hoja: de ahí la puerta torcida.
  // Se separa la hoja del marco y se la acorta sobre su bisagra real.
  const NS = 'http://www.w3.org/2000/svg';
  let leaf = doc.getElementById('door-leaf');
  if (!leaf) {
    leaf = doc.createElementNS(NS, 'g');
    leaf.id = 'door-leaf';
    const kids = Array.from(g.children);
    // hijos 1..5 = hoja (rect, panel, tallado, pomo, pomo); 0/6/7/8/9 = marco
    for (const k of kids.slice(1, 6)) leaf.appendChild(k);
    // el pomo estaba del lado de la bisagra; va junto al borde libre
    for (const c of Array.from(leaf.querySelectorAll('circle'))) c.setAttribute('cx', '150');
    g.appendChild(leaf);
    // el vano va entre el marco (hijo 0) y la hoja, si no el marco lo tapa
    g.insertBefore(hole, leaf);
    leaf.style.transformBox = 'view-box';
    leaf.style.transformOrigin = '374px 220px';
    leaf.style.transition = 'transform .55s cubic-bezier(.3,.7,.2,1)';
  }
  // Rotación pura sobre el eje vertical: scaleX y nada de skew. Girar una hoja
  // no inclina sus cantos verticales; lo que da el volumen es el ancho y el
  // canto que se agrega abajo.
  leaf.style.transform = open ? 'matrix(.42, 0, 0, 1, 0, 0)' : 'none';
  g.style.transform = 'none';
  // canto: sin esto la hoja escorzada se lee como una tabla pegada al vano
  let edge = doc.getElementById('door-edge');
  if (open && !edge) {
    edge = doc.createElementNS(NS, 'rect');
    edge.id = 'door-edge';
    edge.setAttribute('x', '250'); edge.setAttribute('y', '215');
    edge.setAttribute('width', '16'); edge.setAttribute('height', '539');
    edge.setAttribute('fill', '#3b2617');
    edge.setAttribute('stroke', '#241a12'); edge.setAttribute('stroke-width', '2');
    g.insertBefore(edge, leaf);
  } else if (!open && edge) {
    edge.remove();
  }
  hole.style.opacity = open ? '1' : '0';
  hole.style.transition = 'opacity .3s';
}

// ---------- elenco ----------
async function loadCast() {
  const P = PIXI.live2d;
  app = new PIXI.Application({
    view: document.getElementById('live'), width: STAGE_W, height: STAGE_H,
    backgroundAlpha: 0, antialias: true, autoStart: false, resolution: 1,
  });
  const ids = Object.keys(guion.cast).filter((id) => guion.cast[id].model);
  const jobs = ids.map(async (id) => {
    const spec = guion.cast[id];
    try {
      const model = await P.Live2DModel.from(spec.model, { autoInteract: false, autoUpdate: false });
      model.anchor.set(0.5, 1);
      model.visible = false;
      app.stage.addChild(model);
      const target = id === 'teto' ? HOSTS.teto.h : SEAT.h;
      const s = target / model.height;
      const x = id === 'teto' ? HOSTS.teto.x : SEAT.x;
      model.scale.set(s);
      const y = id === 'teto' ? SEAT.y + 120 : SEAT.y;
      model.x = x; model.y = y;
      models[id] = { model, s, x, y, walkY: y - WALK_LIFT, anim: { mode: 'hidden', t: 0 } };
      // expresión de entrada si el modelo trae alguna
      const defs = model.internalModel.motionManager.definitions || {};
      const groups = Object.keys(defs || {});
      models[id].idleGroup = groups.includes('Idle') ? 'Idle' : (groups[0] || null);
      models[id].expressions = Object.keys(model.internalModel.motionManager.expressionManager?.definitions || {});
      if (models[id].idleGroup) {
        // priority 1 = idle; el manager la repite sola al terminar
        model.internalModel.motionManager.startRandomMotion(models[id].idleGroup, 1);
      }
    } catch (err) {
      console.error('[cast] no cargó', id, err);
      const tag = document.createElement('div');
      tag.className = 'fallback';
      tag.textContent = spec.name;
      tag.style.cssText = `position:absolute;z-index:3;left:${(id === 'teto' ? HOSTS.teto.x : SEAT.x) - 130}px;` +
        `bottom:190px;width:260px;text-align:center;font:600 34px Georgia,serif;color:${spec.color};` +
        `border:2px dashed ${spec.color};padding:22px;border-radius:10px;background:rgba(8,12,17,.7)`;
      stage.appendChild(tag);
    }
  });
  await Promise.all(jobs);
}

// ---------- pose ----------
const easeInOut = (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);
const clamp01 = (v) => Math.max(0, Math.min(1, v));

function mouthOf(id, t) {
  const ln = state.line;
  if (!ln || ln.speaker !== id) return 0;
  const k = (t - ln.t) / 0.04;
  if (k < 0 || k >= ln.env.length) return 0;
  const i = Math.floor(k), frac = k - i;
  const a = ln.env[i], b = ln.env[Math.min(i + 1, ln.env.length - 1)];
  return clamp01((a + (b - a) * frac) * 0.95);
}

function poseModel(id, t) {
  const rec = models[id];
  if (!rec) return;
  const { model, s } = rec;
  const a = rec.anim;
  if (a.mode === 'hidden') { model.visible = false; return; }
  model.visible = true;

  // caminar: entra desde la puerta y se hunde en la silla al final del recorrido
  let x = rec.x, y = rec.y, scale = s, alpha = 1, bob = 0;
  if (a.mode === 'in' || a.mode === 'out') {
    const p = clamp01((t - a.t) / a.dur);
    const e = easeInOut(p);
    x = a.mode === 'in' ? DOOR_X + (rec.x - DOOR_X) * e : rec.x + (DOOR_X - rec.x) * e;
    y = a.mode === 'in' ? rec.walkY + (rec.y - rec.walkY) * e : rec.y + (rec.walkY - rec.y) * e;
    // perspectiva leve: entra algo más chico desde el fondo y crece al acercarse.
    // Menos que esto y el escritorio lo corta a la altura del cuello (chibi).
    scale = s * (a.mode === 'in' ? 0.84 + 0.16 * e : 1 - 0.16 * e);
    // pasos: uno cada ~0.22s. Las piernas van detrás del escritorio (fg tapa
    // desde y=858), así que del caminar sólo se ve el rebote del cuerpo.
    bob = Math.abs(Math.sin(p * Math.PI * 9)) * 14 * Math.min(1, (1 - p) * 4);
    alpha = clamp01((t - a.t) / 0.35);
    if (p >= 1) a.mode = a.mode === 'in' ? 'still' : 'hidden';
  }
  model.x = x; model.y = y + bob; model.alpha = alpha;
  model.scale.set(scale);

  // 1) la motion de idle mueve cabeza, cuerpo y respiración
  model.update(1 / 30);
  // 2) la boca va después de la motion (si no, la pisa) y se re-vuelca a la malla
  const core = model.internalModel.coreModel;
  const mouth = mouthOf(id, t) * (a.mode === 'out' ? 0 : 1);
  if (core && core.setParameterValueById) {
    core.setParameterValueById('ParamMouthOpenY', mouth);
    core.setParameterValueById('ParamMouthForm', 0.18 + mouth * 0.25);
    core.update();
  }
}

// ---------- acciones del modelo (toggles / expresiones / motions) ----------
function act(id, name) {
  const rec = models[id];
  if (!rec || !name) return;
  const im = rec.model.internalModel;
  const exprs = im.motionManager.expressionManager?.definitions || {};
  if (exprs[name]) { rec.model.expression(name); return; }
  if ((im.motionManager.definitions || {})[name]) { rec.model.motion(name); return; }
  console.warn('[act] sin expresión ni motion', name, 'para', id);
}

// ---------- HUD ----------
function showPlate(id) {
  const spec = guion.cast[id];
  el('pname').textContent = spec.name;
  el('prole').textContent = spec.role;
  el('plate').style.setProperty('--accent', spec.color);
  el('plate').style.borderLeftColor = spec.color;
  el('plate').classList.add('on');
}
const hidePlate = () => el('plate').classList.remove('on');

function showQuestion(text) {
  el('qtext').textContent = text;
  el('qcard').classList.add('on');
  state.question = true;
}
function hideQuestion() { el('qcard').classList.remove('on'); state.question = false; }

function showVerdict(cue) {
  const v = el('verdict');
  el('vstamp').textContent = cue.result === 'hired' ? 'CONTRATADO' : 'DESCARTADO';
  el('vscore').textContent = `${cue.score} / 100`;
  el('vwhy').textContent = cue.text;
  v.className = 'on ' + cue.result;
  el('meter').firstElementChild.style.background = cue.result === 'hired' ? '#9be2a0' : '#f08b7f';
  requestAnimationFrame(() => { el('meter').firstElementChild.style.width = cue.score + '%'; });
  state.verdictUntil = cue.t + 2.9;
}
function hideVerdict() {
  el('verdict').className = '';
  el('meter').firstElementChild.style.width = '0%';
}

function showSlate(cue) {
  el('sl-kicker').textContent = cue.phase === 'intro' ? 'Hipotenusa Labs presenta' : 'resultado del día';
  el('sl-title').textContent = cue.title;
  el('sl-sub').textContent = cue.subtitle;
  el('sl-foot').textContent = cue.footer;
  el('slate').classList.remove('off');
}
const hideSlate = () => el('slate').classList.add('off');

function showSubs(line) {
  el('swho').textContent = guion.cast[line.speaker].name;
  el('swho').style.color = guion.cast[line.speaker].color;
  el('stext').textContent = line.text;
  el('subs').classList.add('on');
}
const hideSubs = () => el('subs').classList.remove('on');

// ---------- motor de cues ----------
function dispatch(cue, t) {
  switch (cue.kind) {
    case 'slate':
      hideQuestion(); hideSubs(); hideVerdict(); hidePlate(); showSlate(cue);
      break;
    case 'reception':
      hideSlate();
      if (models.teto) { models.teto.anim = { mode: 'still', t }; models.teto.model.visible = true; }
      break;
    case 'door':
      door(cue.state === 'open');
      break;
    case 'enter':
      models.teto && (models.teto.anim = { mode: 'still', t });
      if (models[cue.who]) models[cue.who].anim = { mode: 'in', t, dur: cue.walk };
      state.active = cue.who;
      showPlate(cue.who);
      break;
    case 'sit':
      if (models[cue.who]) models[cue.who].anim = { mode: 'still', t };
      break;
    case 'question':
      showQuestion(cue.text);
      break;
    case 'talk':
      // cue.emote opcional: nombre de expresión o motion del modelo
      if (cue.emote && models[cue.who]) act(cue.who, cue.emote);
      break;
    case 'verdict':
      hideQuestion(); showVerdict(cue);
      break;
    case 'leave':
      hideVerdict(); hidePlate(); hideQuestion();
      if (models[cue.who]) models[cue.who].anim = { mode: 'out', t, dur: cue.walk };
      break;
    case 'clear':
      Object.entries(models).forEach(([id, r]) => { r.anim = { mode: 'hidden', t }; });
      state.active = null; hideSubs();
      break;
    case 'end':
      state.done = true;
      break;
  }
}

function frame() {
  if (!guion) { requestAnimationFrame(frame); return; }
  const t = t0 === null ? 0 : (performance.now() - t0) / 1000;
  while (cursor < guion.cues.length && guion.cues[cursor].t <= t) {
    dispatch(guion.cues[cursor], guion.cues[cursor].t);
    cursor++;
  }
  // línea vigente: subtítulo + boca
  state.line = guion.lines.find((l) => t >= l.t && t < l.t + l.dur) || null;
  if (state.line) showSubs(state.line); else hideSubs();
  if (state.verdictUntil && t > state.verdictUntil) hideVerdict();

  el('tc').textContent = String(Math.floor(t / 60)).padStart(2, '0') + ':' +
    String(Math.floor(t % 60)).padStart(2, '0');

  for (const id of Object.keys(models)) poseModel(id, t);
  if (app) app.render();
  requestAnimationFrame(frame);
}

// ---------- arranque ----------
window.__ready = false;
window.playEvent = () => {
  cursor = 0;
  t0 = performance.now();
  // frame blanco: marca de sincronización para el recorte del video
  el('flash').classList.add('on');
  setTimeout(() => el('flash').classList.remove('on'), 240);
};

(async () => {
  guion = await (await fetch('/media/entrevista/guion.json', { cache: 'no-store' })).json();
  await loadCast();
  el('loading').classList.add('off');
  const first = guion.cues.find((c) => c.kind === 'slate');
  showSlate(first);
  window.__ready = true;
  // hook de debug/QA: permite medir posiciones y motions desde el navegador
  window.__scene = { get models() { return models; }, get app() { return app; }, state, door, act };
  requestAnimationFrame(frame);
})().catch((err) => {
  console.error('[scene] arranque falló', err);
  el('loading').textContent = 'error: ' + err.message;
});
</script>
</body>
