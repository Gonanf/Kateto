<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Oficina · Fondo de entrevista</title>
<style>
:root{--wood:#7a4b2a;--paper:#f3e7c9;--olive:#4a5d3a;--night:#101820;--light:#ffd08a;--parallax:0px}*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#253039}svg{display:block;width:1920px;height:1080px;font-family:Georgia,'Times New Roman',serif}.room{transform:translateX(var(--parallax))}.dust{animation:drift 10s ease-in-out infinite alternate}.dust:nth-child(2n){animation-delay:-4s}.blind{transform-origin:1480px 318px;animation:sway 5s ease-in-out infinite alternate}.second{transform-origin:1717px 164px;animation:tick 60s steps(60,end) infinite}.leaf{transform-box:fill-box;transform-origin:bottom center;animation:leaf 3.7s ease-in-out infinite alternate}.beam{opacity:.15;animation:glow 7s ease-in-out infinite alternate}@keyframes drift{from{transform:translate(0,30px);opacity:.08}to{transform:translate(38px,-16px);opacity:.42}}@keyframes sway{from{transform:rotate(-.3deg)}to{transform:rotate(.35deg)}}@keyframes tick{to{transform:rotate(360deg)}}@keyframes leaf{from{transform:rotate(-1.4deg)}to{transform:rotate(1.8deg)}}@keyframes glow{from{opacity:.12}to{opacity:.2}}
</style></head><body>
<svg viewBox="0 0 1920 1080" role="img" aria-label="Oficina de entrevistas cálida, vista desde el escritorio del entrevistador">

<defs><linearGradient id="wall" x2="0" y2="1"><stop stop-color="#d8c7a5"/><stop offset="1" stop-color="#b8a88c"/></linearGradient><linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd08a" stop-opacity=".68"/><stop offset="1" stop-color="#ffd08a" stop-opacity="0"/></linearGradient><linearGradient id="floor" x2="0" y2="1"><stop stop-color="#806246"/><stop offset="1" stop-color="#493626"/></linearGradient><pattern id="grain" width="84" height="84" patternUnits="userSpaceOnUse"><path d="M0 12h84M0 48h84" stroke="#fff" stroke-opacity=".035"/><path d="M14 0v84" stroke="#30251b" stroke-opacity=".035"/></pattern><filter id="soft"><feGaussianBlur stdDeviation="18"/></filter></defs>
<g class="room">
<rect width="1920" height="830" fill="url(#wall)" id="bg-wall"/><rect width="1920" height="830" fill="url(#grain)"/><rect y="830" width="1920" height="250" fill="url(#floor)"/><rect y="820" width="1920" height="18" fill="#6a4a33"/><path d="M0 852H1920M0 990H1920" stroke="#d1ae7e" opacity=".11"/>

<g id="bg-window"><rect x="1160" y="110" width="530" height="405" rx="4" fill="#725438"/><rect x="1176" y="126" width="498" height="373" fill="#82929a"/><rect x="1188" y="138" width="474" height="349" fill="#c5d0c7"/><path d="M1188 138h474v349h-474z" fill="#9eb0ad"/><path d="M1190 255q80-66 156 0t156 0t160 0v232h-472z" fill="#8b9c89"/><path d="M1190 323q95-41 174 4t144-6t154 1v165h-472z" fill="#73816c"/><path d="M1425 138v349M1188 313h474" stroke="#70553b" stroke-width="17"/><rect x="1144" y="98" width="562" height="22" fill="#6a4a33"/><rect x="1148" y="516" width="555" height="19" fill="#6a4a33"/>
<g class="blind" fill="#e4d4b6"><path d="M1183 164h484v21h-484zM1183 198h484v21h-484zM1183 232h484v21h-484zM1183 266h484v21h-484zM1183 300h484v21h-484z" opacity=".96"/><path d="M1191 150v181M1659 150v181" stroke="#604c39" stroke-width="4" fill="none"/></g></g>
<!-- Luz diagonal, detrás del área central --> <path class="beam" d="M1180 315L1650 520 1250 835 770 835Z" fill="url(#sun)"/><path d="M1230 538L1550 678 1370 816 1010 816Z" fill="#ffd08a" opacity=".045"/>

<g id="bg-door"><rect x="95" y="198" width="296" height="573" fill="#684529"/><rect x="112" y="215" width="262" height="539" fill="#94663e"/><rect x="134" y="239" width="218" height="490" fill="#835834"/><path d="M152 256h182v205H152zM152 482h182v225H152z" fill="#8e623c" stroke="#714a2d" stroke-width="9"/><circle cx="327" cy="492" r="11" fill="#d6b875"/><circle cx="327" cy="492" r="4" fill="#6b4c2d"/><rect x="84" y="190" width="318" height="15" fill="#543b2c"/><path d="M382 216v535" stroke="#4e3828" stroke-width="9" opacity=".65"/><circle cx="369" cy="267" r="4" fill="#d5bc8c"/><circle cx="369" cy="710" r="4" fill="#d5bc8c"/></g>
<!-- Certificados -->
<g><rect x="515" y="184" width="213" height="269" fill="#6a4b31"/><rect x="527" y="196" width="189" height="245" fill="#eadcbb"/><rect x="541" y="211" width="161" height="214" fill="#f3e7c9"/><path d="M565 260h114M565 279h114M577 300h90M565 353h114" stroke="#9c8967" stroke-width="4"/><circle cx="621" cy="327" r="22" fill="none" stroke="#a77e3d" stroke-width="3"/><path d="M621 307l5 15 15 4-12 9 2 15-10-9-13 7 5-14-10-10 15 1z" fill="#b68b48"/><rect x="774" y="220" width="192" height="231" fill="#6a4b31"/><rect x="786" y="232" width="168" height="207" fill="#f3e7c9"/><path d="M808 275h124M808 296h124M821 320h98M808 365h124" stroke="#9c8967" stroke-width="4"/><circle cx="870" cy="343" r="19" fill="none" stroke="#a77e3d" stroke-width="3"/></g>

<g id="bg-shelf"><rect x="1760" y="365" width="120" height="455" fill="#6c492d"/><rect x="1745" y="354" width="151" height="20" fill="#8a603b"/><rect x="1745" y="510" width="151" height="18" fill="#8a603b"/><rect x="1745" y="665" width="151" height="18" fill="#8a603b"/><rect x="1745" y="812" width="151" height="20" fill="#8a603b"/>
<g stroke="#3e392c" stroke-width="3"><path d="M1764 495v-99h25v99z" fill="#697252"/><path d="M1792 495v-112h30v112z" fill="#b78b55"/><path d="M1825 495v-89h22v89z" fill="#8b5140"/><path d="M1852 495v-103h29v103z" fill="#c6ae7b"/><path d="M1765 651v-99h31v99z" fill="#9c6944"/><path d="M1800 651v-119h28v119z" fill="#596548"/><path d="M1832 651v-91h23v91z" fill="#c19b65"/><path d="M1859 651v-111h25v111z" fill="#795542"/><path d="M1766 801v-100h23v100z" fill="#bf9865"/><path d="M1793 801v-112h30v112z" fill="#775443"/><path d="M1827 801v-95h27v95z" fill="#68704d"/><path d="M1858 801v-106h26v106z" fill="#a67d4e"/></g></g>
<!-- Alfombra despejada para personaje: tono bajo y contraste moderado -->
<ellipse cx="1000" cy="930" rx="544" ry="120" fill="#665641" opacity=".58"/><ellipse cx="1000" cy="930" rx="472" ry="91" fill="#80705b" opacity=".33"/><path d="M487 929q512-82 1026 0M536 967q466-61 930 0" fill="none" stroke="#b6a080" stroke-opacity=".16" stroke-width="3"/>

<g id="bg-plant"><path d="M186 757h174l-17 98H203z" fill="#a7613c"/><path d="M201 777h145" stroke="#d59463" stroke-width="8"/><path d="M271 765V571" stroke="#4a5d3a" stroke-width="9"/><g fill="#4a5d3a"><path class="leaf" d="M270 680q-98-78-124-23 54 59 124 23z"/><path class="leaf" d="M273 653q91-96 135-43-53 75-135 43z"/><path class="leaf" d="M270 614q-46-102-97-76 24 70 97 76z"/><path class="leaf" d="M273 592q33-106 85-83-14 78-85 83z"/><path class="leaf" d="M272 708q-89-52-119-4 58 48 119 4z"/><path class="leaf" d="M274 690q86-70 120-22-53 59-120 22z"/></g><path d="M271 578v160" stroke="#83906a" stroke-width="3"/></g>
<!-- Polvo iluminado --> <g fill="#fff0ce"><circle class="dust" cx="1100" cy="390" r="3"/><circle class="dust" cx="1350" cy="604" r="2.5"/><circle class="dust" cx="1552" cy="416" r="2"/><circle class="dust" cx="980" cy="550" r="3"/><circle class="dust" cx="1250" cy="741" r="2"/><circle class="dust" cx="1600" cy="687" r="3"/><circle class="dust" cx="850" cy="392" r="2"/><circle class="dust" cx="1450" cy="790" r="2.5"/></g>
<!-- Zócalos --> <path d="M0 805h1920v26H0z" fill="#796044"/><path d="M0 805h1920v5H0z" fill="#c7a67b" opacity=".45"/>
<!-- Silla del candidato: respaldo alto detrás del escritorio (el personaje se
     dibuja en el canvas de arriba, así que queda sentado DELANTE de ella). -->
<g id="bg-chair" transform="translate(182 0)">
  <ellipse cx="1268" cy="1042" rx="150" ry="26" fill="#3b2a1c" opacity=".28"/>
  <path d="M1148 700q0-26 26-26h188q26 0 26 26v268h-240z" fill="#4a5d3a" stroke="#33412a" stroke-width="7"/>
  <path d="M1172 726h192v196h-192z" fill="#5c7050" opacity=".55"/>
  <path d="M1134 962h268q14 0 14 14v26h-296v-26q0-14 14-14z" fill="#60744d" stroke="#33412a" stroke-width="6"/>
  <path d="M1176 1006l-14 62M1360 1006l16 62" stroke="#38433c" stroke-width="13" stroke-linecap="round"/>
</g>
</g></svg></body></html>
