syntax = "proto3";
package manager.product_owner;

service ProductOwner {
  rpc CreateProject(ProjectRequest) returns (stream ProjectResponse);
}

message ProjectRequest {
  string idea = 1;
  string disponibility = 2;
  repeated string team = 3;
}

message ProjectResponse {
  string stage = 1;       // "project_info", "pbis", "dod", "sprints", "tasks", "document", "done", "error"
  string message = 2;     // Human-readable progress message
  string data_json = 3;   // JSON payload for this stage
  string markdown = 4;    // Final markdown document (only on "done" stage)
}

