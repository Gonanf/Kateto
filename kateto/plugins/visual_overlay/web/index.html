<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kateto Visual Overlay</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: sans-serif;
      color: white;
    }
    #container {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #avatar {
      height: 180px;
      width: auto;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.4));
    }
    #caption {
      margin-top: 10px;
      max-width: 640px;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 16px;
      border-radius: 8px;
      text-align: center;
      font-size: 1.2rem;
      line-height: 1.4;
      min-height: 1.4em;
    }
  </style>
</head>
<body>
  <div id="container" data-signals="{voice_id: 'jane', rms: 0, text: ''}">
    <img id="avatar"
         alt=""
         data-attr:src="$rms > 0.01 ? '/voices/' + $voice_id + '/mouth.png' : '/voices/' + $voice_id + '/top.png'"
         onerror="this.src='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=='">
    <div id="caption" data-text="$text"></div>
  </div>

  <script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.2/bundles/datastar.js"></script>

  <!-- Datastar v1.0.2 ships no WebSocket client (fetch/SSE only), so the browser
       WS feeds the same CDN module's mergePatch() and Datastar renders. -->
  <script type="module">
    import { mergePatch } from 'https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.2/bundles/datastar.js'

    const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/overlay`)
    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data)
      const patch = { voice_id: msg.voice_id }
      if (msg.type === 'subtitle') patch.text = msg.text
      if (msg.type === 'viseme') patch.rms = msg.rms
      mergePatch(patch)
    }
    // ponytail: no reconnect loop; add ws.onclose -> retry if the overlay must self-heal
  </script>
</body>
</html>
