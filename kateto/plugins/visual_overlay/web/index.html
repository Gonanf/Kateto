<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kateto Visual Overlay</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: sans-serif;
      color: white;
    }
    #container {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .avatar-container {
      position: relative;
      width: 256px;
      height: 256px;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.4));
      overflow: visible;
    }
    .layer-head {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 2;
      pointer-events: none;
    }
    .layer-jaw {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 1;
      transform-origin: 50% 65%;
      will-change: transform;
      transition: transform 0.03s ease-out;
      pointer-events: none;
    }
    .avatar-fallback {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 2;
    }
    #caption {
      margin-top: 10px;
      max-width: 640px;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 16px;
      border-radius: 8px;
      text-align: center;
      font-size: 1.2rem;
      line-height: 1.4;
      min-height: 1.4em;
    }
  </style>
</head>
<body>
  <div id="container" data-signals="{voice_id: 'jane', rms: 0, jawOffsetX: 0, jawOffsetY: 0, jawRotation: 0, use_fallback: false, text: ''}">
    <div id="vtuber-overlay" class="avatar-container">
      <!-- Muppet Cutout Layers (Head fixed z-2, Jaw mobile z-1) -->
      <img id="avatar-head"
           class="layer-head"
           alt="Avatar Head"
           data-show="!$use_fallback"
           data-attr:src="'/voices/' + $voice_id + '/avatar_head.png'"
           onerror="window.handleCutoutError && window.handleCutoutError()" />

      <img id="avatar-jaw"
           class="layer-jaw"
           alt="Avatar Jaw"
           data-show="!$use_fallback"
           data-attr:src="'/voices/' + $voice_id + '/avatar_jaw.png'"
           data-style-transform="'translate(' + $jawOffsetX + 'px, ' + $jawOffsetY + 'px) rotate(' + $jawRotation + 'deg)'"
           data-style:transform="'translate(' + $jawOffsetX + 'px, ' + $jawOffsetY + 'px) rotate(' + $jawRotation + 'deg)'"
           onerror="window.handleCutoutError && window.handleCutoutError()" />

      <!-- Fallback Layer (Classic top.png / mouth.png) -->
      <img id="avatar-fallback"
           class="avatar-fallback"
           alt="Avatar Classic"
           data-show="$use_fallback"
           data-attr:src="$rms > 0.01 ? '/voices/' + $voice_id + '/mouth.png' : '/voices/' + $voice_id + '/top.png'"
           onerror="this.src='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=='" />
    </div>

    <div id="caption" data-text="$text"></div>
  </div>

  <script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.2/bundles/datastar.js"></script>

  <!-- Datastar v1.0.2 ships no WebSocket client (fetch/SSE only), so the browser
       WS feeds the same CDN module's mergePatch() and Datastar renders. -->
  <script type="module">
    import { mergePatch } from 'https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.2/bundles/datastar.js'

    let activeVoice = 'jane';
    let captionClearTimer = null;

    // Global fallback handler when avatar_head.png or avatar_jaw.png is missing (404)
    window.handleCutoutError = () => {
      mergePatch({ use_fallback: true });
    };

    // Pure mapping: rms -> { jawOffsetX, jawOffsetY, jawRotation }
    // Moves UP (negative translateY), randomly to the sides with enhanced force,
    // with rotation tilting along with the lateral movement direction
    function computeJawKinematics(rms) {
      if (typeof rms !== 'number' || rms < 0.015) {
        return { jawOffsetX: 0, jawOffsetY: 0, jawRotation: 0 };
      }
      // Punchy response curve with even greater force
      const factor = Math.min(1.0, Math.max(0.0, Math.pow((rms - 0.015) / 0.985, 0.68)));
      // Move UP with strong force (up to -52px)
      const upMovement = -Number((factor * 52.0).toFixed(2));
      // Random lateral direction (-1.0 to +1.0) with strong side excursion (up to +/- 28px)
      const sideDir = (Math.random() * 2 - 1);
      const sideShake = Number((sideDir * factor * 28.0).toFixed(2));
      // Rotation follows the movement: tilting in the direction of lateral movement with greater rotation (up to +/- 34 deg)
      const tilt = Number(((sideDir * 0.9 + (Math.random() * 0.2 - 0.1)) * factor * 34.0).toFixed(2));

      return {
        jawOffsetX: sideShake,
        jawOffsetY: upMovement,
        jawRotation: tilt,
      };
    }

    const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/overlay`);

    ws.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);
        const patch = {};

        const voiceId = msg.voice_id || (msg.data && msg.data.voice_id);
        if (voiceId && voiceId !== activeVoice) {
          activeVoice = voiceId;
          patch.voice_id = voiceId;
          // ponytail: reset fallback flag when switching voices to probe cutout first
          patch.use_fallback = false;
        }

        let newText = null;
        if (msg.type === 'viseme' && msg.text) {
          newText = msg.text;
        } else if (msg.type === 'subtitle' || msg.event === 'text_chunk') {
          const t = msg.text !== undefined ? msg.text : (msg.data && msg.data.text);
          if (t !== undefined) newText = t;
        }

        if (newText) {
          patch.text = newText;
          if (captionClearTimer) {
            clearTimeout(captionClearTimer);
            captionClearTimer = null;
          }
        }

        const rawRms = (typeof msg.rms === 'number') ? msg.rms : (msg.data && typeof msg.data.rms === 'number') ? msg.data.rms : null;
        if (rawRms !== null) {
          patch.rms = rawRms;
          const { jawOffsetX, jawOffsetY, jawRotation } = computeJawKinematics(rawRms);
          patch.jawOffsetX = jawOffsetX;
          patch.jawOffsetY = jawOffsetY;
          patch.jawRotation = jawRotation;

          if (rawRms < 0.015 && !captionClearTimer && patch.text !== '') {
            captionClearTimer = setTimeout(() => {
              mergePatch({ text: '' });
              captionClearTimer = null;
            }, 3500);
          }
        }

        mergePatch(patch);
      } catch (err) {
        console.error('Failed to parse overlay event:', err);
      }
    };
    // ponytail: no reconnect loop; add ws.onclose -> retry if the overlay must self-heal
  </script>
</body>
</html>
