<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="icon" href="data:," />
  <title>Kateto · Discusión</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0b1120; color: #e2e8f0;
    }
    body { display: flex; flex-direction: column; }

    header {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px;
      background: rgba(15, 23, 42, 0.92);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      position: sticky; top: 0; z-index: 10;
    }
    header h1 { font-size: 1rem; font-weight: 600; margin: 0; color: #f1f5f9; }
    #conn {
      width: 10px; height: 10px; border-radius: 50%;
      background: #ef4444; transition: background 0.3s ease;
    }
    #conn.on { background: #22c55e; }
    #voice-select {
      margin-left: auto;
      background: rgba(30, 41, 59, 0.9);
      color: #e2e8f0; border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px; padding: 6px 10px; font-size: 0.85rem;
    }

    #status-bar {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 8px 16px; background: rgba(15, 23, 42, 0.6);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      min-height: 36px;
    }
    .voice-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 10px; border-radius: 12px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.75rem; color: #94a3b8;
    }
    .voice-chip .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #475569;
    }
    .voice-chip.thinking .dot { background: #f59e0b; box-shadow: 0 0 6px #f59e0b; }
    .voice-chip.talking .dot { background: #3b82f6; box-shadow: 0 0 6px #3b82f6; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    #chat {
      flex: 1; overflow-y: auto; padding: 20px 16px;
      display: flex; flex-direction: column; gap: 12px;
    }

    .msg {
      max-width: min(640px, 78%);
      padding: 9px 13px; border-radius: 14px;
      font-size: 0.92rem; line-height: 1.45;
      white-space: pre-wrap; word-wrap: break-word;
    }
    .msg .who { display: block; font-size: 0.7rem; color: #94a3b8; margin-bottom: 3px; }
    .msg.voice { align-self: flex-start; background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(255, 255, 255, 0.07); }
    .msg.voice.streaming { border-color: rgba(59, 130, 246, 0.6); }
    .msg.user { align-self: flex-end; background: rgba(37, 99, 235, 0.85); }
    .msg.error { align-self: center; background: rgba(153, 27, 27, 0.5); border: 1px solid rgba(239, 68, 68, 0.5); color: #fecaca; }

    .msg.diagram {
      align-self: flex-start; background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(129, 140, 248, 0.35); border-radius: 14px;
      max-width: min(820px, 92%); padding: 12px 14px;
    }
    .msg.diagram .diagram-title {
      font-size: 0.8rem; font-weight: 600; color: #a5b4fc; margin-bottom: 8px;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .msg.diagram pre {
      margin: 0; padding: 10px 12px; border-radius: 8px;
      background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.08);
      color: #c7d2fe; font-size: 0.8rem; line-height: 1.4;
      overflow-x: auto; white-space: pre;
    }

    footer {
      display: flex; gap: 10px; padding: 12px 16px;
      background: rgba(15, 23, 42, 0.92);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    #input {
      flex: 1; background: rgba(30, 41, 59, 0.9);
      color: #e2e8f0; border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px; padding: 10px 14px; font-size: 0.92rem;
      resize: none;
    }
    #input:focus { outline: none; border-color: rgba(59, 130, 246, 0.7); }
    #send {
      background: rgba(37, 99, 235, 0.85); color: #fff;
      border: none; border-radius: 10px; padding: 0 20px;
      font-size: 0.92rem; font-weight: 500; cursor: pointer;
      transition: background 0.2s ease;
    }
    #send:hover { background: rgba(59, 130, 246, 0.95); }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <span id="conn"></span>
    <h1>Kateto · Discusión</h1>
    <select id="voice-select" title="Interlocutor">
      <option value="auto" selected>Auto (ponderado)</option>
    </select>
  </header>
  <div id="status-bar"></div>
  <main id="chat"></main>
  <footer>
    <textarea id="input" rows="1" placeholder="Escribí tu mensaje… (Enter para enviar)"></textarea>
    <button id="send">Enviar</button>
  </footer>

  <script>
    'use strict';

    const chat = document.getElementById('chat');
    const statusBar = document.getElementById('status-bar');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const sel = document.getElementById('voice-select');
    const conn = document.getElementById('conn');

    // ---- estado ----
    const chips = new Map();          // voice -> chip element
    const openBursts = new Map();     // voice -> {el, textEl}  (text_chunk en curso)
    const knownVoices = new Set();    // ids vistos en GET /voices o en el stream

    function esc(node, text) { node.textContent = text; }

    function chipFor(voice) {
      if (!voice) return null;
      let chip = chips.get(voice);
      if (!chip) {
        chip = document.createElement('span');
        chip.className = 'voice-chip';
        const dot = document.createElement('span');
        dot.className = 'dot';
        const name = document.createElement('span');
        esc(name, voice);
        chip.appendChild(dot); chip.appendChild(name);
        statusBar.appendChild(chip);
        chips.set(voice, chip);
      }
      return chip;
    }

    function setStatus(voice, status) {
      if (!voice) return;
      knownVoices.add(voice);
      const chip = chipFor(voice);
      if (!chip) return;
      chip.classList.remove('thinking', 'talking');
      if (status === 'thinking' || status === 'talking') chip.classList.add(status);
      if (status === 'talking') chip.style.display = '';
      else if (status === 'idle') chip.style.display = '';
      if (status === 'idle' || status === 'waiting') chip.style.display = '';
    }

    function addMessage(cls, who, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      if (who) {
        const w = document.createElement('span');
        w.className = 'who';
        esc(w, who);
        div.appendChild(w);
      }
      const t = document.createElement('span');
      esc(t, text);
      div.appendChild(t);
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function closeBurst(voice) {
      const burst = openBursts.get(voice);
      if (!burst) return;
      burst.el.classList.remove('streaming');
      setStatus(voice, 'idle');
      openBursts.delete(voice);
    }

    function closeAllBursts() {
      for (const voice of Array.from(openBursts.keys())) closeBurst(voice);
    }

    // ---- render de eventos ----
    function onEnvelope(msg) {
      const data = msg.data || {};
      switch (msg.name) {
        case 'transcription': {
          const text = (data.text || '').trim();
          if (text) addMessage('user', 'Tú', text);
          break;
        }
        case 'text_chunk': {
          const voice = data.voice_id;
          const text = data.text || '';
          if (!voice || !text) break;
          knownVoices.add(voice);
          const chip = chipFor(voice);
          if (chip) chip.classList.add('talking');
          let burst = openBursts.get(voice);
          if (!burst) {
            const div = document.createElement('div');
            div.className = 'msg voice streaming';
            const w = document.createElement('span');
            w.className = 'who';
            esc(w, voice);
            const t = document.createElement('span');
            div.appendChild(w); div.appendChild(t);
            chat.appendChild(div);
            burst = { el: div, textEl: t };
            openBursts.set(voice, burst);
          }
          burst.textEl.textContent += text;   // text_chunk es incremental
          chat.scrollTop = chat.scrollHeight;
          if (data.final) closeBurst(voice);
          break;
        }
        case 'visual_explanation': {
          const div = document.createElement('div');
          div.className = 'msg diagram';
          const title = document.createElement('div');
          title.className = 'diagram-title';
          esc(title, (data.title || data.voice_id || 'diagrama').toString());
          const pre = document.createElement('pre');
          esc(pre, data.code || '(código vacío)');
          div.appendChild(title); div.appendChild(pre);
          chat.appendChild(div);
          chat.scrollTop = chat.scrollHeight;
          break;
        }
        case 'voice_status':
          if (data.voice) {
            setStatus(data.voice, data.status);
            if (data.status === 'talking') {
              knownVoices.add(data.voice);
            }
          }
          break;
        case 'voice_idle':
          if (data.voice) { setStatus(data.voice, 'idle'); closeBurst(data.voice); }
          break;
        case 'interrupt':
          closeAllBursts();
          break;
      }
    }

    // ---- WS /events/stream con reconexión ----
    function connectWs() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(proto + '://' + location.host + '/events/stream');
      ws.onopen = () => conn.classList.add('on');
      ws.onmessage = (ev) => {
        try { onEnvelope(JSON.parse(ev.data)); } catch (e) { console.error(e); }
      };
      ws.onclose = () => {
        conn.classList.remove('on');
        setTimeout(connectWs, 2000);
      };
    }

    // ---- selector de interlocutor ----
    async function loadVoices() {
      try {
        const resp = await fetch('/voices');
        const voices = await resp.json();
        for (const v of voices) {
          if (!v.enabled) continue;
          const opt = document.createElement('option');
          opt.value = v.name;
          esc(opt, v.name);
          sel.appendChild(opt);
          chipFor(v.name);
          knownVoices.add(v.name);
        }
      } catch (e) { console.error('GET /voices failed', e); }
    }

    // ---- envío ----
    async function send() {
      const text = input.value.trim();
      if (!text) return;
      const mode = sel.value;   // "auto" o <voice_id>
      const payload = mode === 'auto'
        ? { event_name: 'transcription', data: { text } }
        : { event_name: 'generate', data: { prompt: text, origin: 'external' }, target: mode };
      sendBtn.disabled = true;
      try {
        const resp = await fetch('/events/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const result = await resp.json();
        if (result && result.error) addMessage('error', null, String(result.error));
      } catch (e) {
        addMessage('error', null, 'POST /events/send falló: ' + e);
      } finally {
        sendBtn.disabled = false;
        input.value = '';
        input.focus();
      }
    }

    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });

    connectWs();
    loadVoices();
  </script>
</body>
</html>
