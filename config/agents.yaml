server:
  websocket_port: 8765
  websocket_host: "127.0.0.1"
  message_display_duration: 5.0
  godot_connect_timeout: 5.0
  godot_reconnect_interval: 3.0

agents:
  kateto-charlatan:
    display_name: "Kateto"
    portrait: "assets/portraits/charlatan.png"
    voice: "es-AR-ElenaNeural"
    style:
      text_color: "#FFFFFF"
      bubble_color: "#2A1A3A"
      font_size: 24
      display_mode: "prominent"
    tts_enabled: true
    animation:
      portrait_transition: "fade"
      text_animation: "typewriter"

  kateto-soñador:
    display_name: "Kateto (Interior)"
    portrait: "assets/portraits/soñador.png"
    voice: "es-AR-ElenaNeural"
    style:
      text_color: "#B8B8D0"
      bubble_color: "#1A1A2E"
      font_size: 18
      display_mode: "subtle"
    tts_enabled: false
    animation:
      portrait_transition: "fade"
      text_animation: "fade"

  kateto-orquesta:
    display_mode: "hidden"

default:
  portrait: "assets/portraits/default.png"
  voice: "es-AR-ElenaNeural"
  style:
    text_color: "#FFFFFF"
    bubble_color: "#333333"
    font_size: 20
    display_mode: "prominent"
  tts_enabled: true
  animation:
    portrait_transition: "fade"
    text_animation: "typewriter"
