[kateto]
name = "Kateto"
language = "en"
debug = false
hot_reload = false
log_level = "INFO"

[compiler.whisper]
backend = "vulkan"

[compiler.llama]
backend = "vulkan"

[plugin.audio_input_mic]
enabled = true
sample_rate = 16000
silence_timeout = 1.5
# Cierre de turno semántico (EOT): cuando un silencio cerraría el turno, se
# transcribe el buffer parcial y el gate decide si el enunciado terminó. Sólo
# tiene efecto si el ASR activo expone transcribe_parcial (parakeet server).
eot_partial_hold = true
vad_model = "silero"
# Barge-in vs self-bleed (no AEC): VAD inside this window after playback start
# is treated as the speaker bleeding into the mic. Real barge-in must also be
# louder than the smoothed playback level (x barge_in_level_factor) and sustain
# that for barge_in_min_speech_ms. Turn accumulation: consecutive segments
# closer than turn_silence_timeout merge into one audio_chunk (one Whisper
# pass); max_turn_secs caps the turn buffer.
# barge_in_grace_ms = 800.0
# barge_in_level_factor = 1.3
# barge_in_min_speech_ms = 300.0
# turn_silence_timeout = 2.0
# max_turn_secs = 30.0
# turn_hold_ms = 0.0

[plugin.audio_processor_whisper]
enabled = true
# backend = "pywhispercpp" # pywhispercpp | server | http | command
# gpu_device = 1 # whisper.cpp Vulkan device index (see vulkaninfo --summary)
endpoint = "http://127.0.0.1:8090"

# Local parakeet (CrispASR) STT — ALTERNATIVE to audio_processor_whisper.
# Keep exactly ONE of the two `enabled = true`: both subscribe to `audio_chunk`
# with capability `transcribe`, so both would transcribe every chunk.
#
# backend selects the transport:
#   server (default) — talks to an externally-launched CrispASR `--server` process
#                      (model resident; see ASR-PARAKEET.md for the launch command).
#                      The process must be up BEFORE enabling the plugin.
#   cli              — spawns the binary per invocation (full model load each turn).
#   stream           — opens the binary ONCE in `--stream --stream-json` mode and
#                      feeds raw PCM per audio_chunk (live partials + finals).
[plugin.audio_processor_parakeet]
enabled = false
backend = "server"              # server (recommended) | cli | stream
motor = "ultra"                 # ultra (quality) | redux (min TTFT profile). For
                                # `cli`/`stream` it picks the model; for `server`
                                # it is informational only (server holds its model).
host = "127.0.0.1"
port = 8098
language = "es"                 # forced language (e.g. es, en), omitted when unset
timeout = 120.0                 # per-transcription timeout (server can hang)
# --- cli/stream-only overrides (ignored when backend = "server") ---
# bin = "/run/media/chaos/secundario/proyectos/crispasr/crispasr-linux-x86_64-vulkan/crispasr"
# model = ""        # e.g. .../parakeet-redux-q8_0.gguf to pin the redux motor file
# gpu_backend = "vulkan"        # GPU backend passed to --gpu-backend (cpu = no GPU flags)
# device = "1"
# --- stream-only tuning (ignored unless backend = "stream") ---
# stream_step_ms = 500                # accumulation window: bounds partial cadence
# stream_final_on_silence_ms = 600    # silence after speech before the final closes
# stream_max_restarts = 3             # child restarts before degrading to no-streaming
# stream_final_wait_s = 30.0          # aclose() waits this long for the last final
# ventana = 30   # sliding-window seconds — long audio only (ignored per-chunk)
# solape = 3     # overlap seconds for sliding-window

[plugin.executor_classifier]
enabled = true
# backend = "mmbert" # mmbert | llamacpp | http | command
model_endpoint = "http://127.0.0.1:8091"
model = "classifier"

[plugin.executor_workflow_router]
enabled = false
model_endpoint = "http://127.0.0.1:8091"
model = "classifier"

[plugin.voice_llm]
enabled = true
endpoint = "http://127.0.0.1:8092/v1"
model = "voice"

[plugin.audio_output_zonos]
enabled = true
endpoint = "http://127.0.0.1:8093"
stream = true

[plugin.audio_output_camb]
enabled = false
endpoint = "https://client.camb.ai/apis"
api_key = ""
model = "mars-8.1-flash-beta"
default_voice_id = 147320
default_language = "en-us"

[plugin.audio_output_edgetts]
enabled = false
default_voice = "es-AR-ElenaNeural"
default_language = "es-AR-ElenaNeural"
stream = true

[plugin.audio_output_boson]
enabled = false
endpoint = "https://api.boson.ai/v1/audio/speech"
api_key = ""
model = "higgs-tts-3"
default_voice = "chloe"

[plugin.audio_output_player]
enabled = true

[voice.jane]
enabled = true
skills = ["orchestrator", "look-at"]
mcp_servers = ["system"]
stream = true
max_tokens = 4096
retries = 2
timeout = 600
# thinking = true  # false → manda reasoning_effort="none" al proveedor
# reasoning_effort = "none"  # none|minimal|low|medium|high (gateway: off|disabled|disable → none)

[voice.doktor]
enabled = true
skills = ["backlog", "risk-analysis", "planning-poker", "look-at"]
mcp_servers = ["system"]
stream = true
max_tokens = 4096
retries = 2
timeout = 600
# thinking = true  # false → manda reasoning_effort="none" al proveedor
# reasoning_effort = "none"  # none|minimal|low|medium|high (gateway: off|disabled|disable → none)

[voice.conquest]
enabled = true
skills = ["backlog", "look-at"]
mcp_servers = ["system"]
stream = true
max_tokens = 4096
retries = 2
timeout = 600
# thinking = true  # false → manda reasoning_effort="none" al proveedor
# reasoning_effort = "none"  # none|minimal|low|medium|high (gateway: off|disabled|disable → none)

[voice.whisperer]
enabled = true
skills = ["orchestrator", "look-at"]
mcp_servers = ["system"]
stream = true
max_tokens = 4096
retries = 2
timeout = 600
# thinking = true  # false → manda reasoning_effort="none" al proveedor
# reasoning_effort = "none"  # none|minimal|low|medium|high (gateway: off|disabled|disable → none)

[mcp_servers.system]
command = "kateto"

# BYO video-rag sidecar for the vision describe fallback chain (plugin-side
# use only — no voice mcp_servers entry). Inherits Kateto's process env.
[mcp_servers.video_rag]
command = "video-rag"
args = ["mcp", "serve"]
# enabled = false

[cli]
allowlist = ["git", "ls", "pwd", "cat", "echo", "date"]

[plugin.executor_interrupt]
enabled = true

[plugin.executor_todo_list]
enabled = true

[plugin.connector_cli]
enabled = true

[plugin.backlog]
enabled = true

[plugin.voice_soul_manager]
enabled = true

[plugin.voice_manager]
enabled = true
voice_probabilities = { jane = 0.7, doktor = 0.15, conquest = 0.1, whisperer = 0.05 }

[plugin.http_server]
enabled = true
host = "127.0.0.1"
port = 8099

# End-of-turn two-stage text gate (fail-open: off/disabled/missing classifier
# behaves exactly like today — TurnGate.decide() path unchanged).
# EOT_ETAPA2 env overrides etapa2 at runtime (base|ft; unknown -> base+warning).
# Etapa 2 choice: only ft is servable (REPORTE-HIBRIDO.md, CPU batch 1: ft ridge
# re-entrenada mismo forward F1 0.8412 @ ~44ms, p95 51.6, unica que cumple).
# base has NO exported ONNX head (it needs a second forward of the pretrained
# encoder under a single---onnx protocol), so base == gate off: the gate reports
# unavailable with a warning and every classify fails open to RESPOND. Set
# etapa2="ft" (or EOT_ETAPA2=ft) to actually run the classifier.
[plugin.eot_gate]
enabled = true
timeout = 1.0
python = "python3"
script = "/run/media/chaos/secundario/proyectos/kateto-eot2/clasificador_hibrido.py"
etapa2 = "ft"

[plugin.executor_vision]
enabled = true
source_default = "screen"
window_secs = 5.0
capture_fps = 1.0
describe_interval = "30s"
# ambient_delivery = "context" no habla, sólo alimenta el prompt de las voces
# como contexto visual de fondo sin disparar turnos de habla.
ambient_delivery = "context"
ambient_all_voices = false
# ambient_exclude = []
ambient_max_chars = 280
vision_max_tokens = 300
vision_timeout = 60.0
# Frames por describe: cada frame cuesta ~2350 tokens de visión (~36 s de
# prefill a ~66 tok/s), así que la narración periódica manda 2 (el más viejo
# y el más nuevo). El sidecar usa max(vision_timeout, 120) de timeout.
max_frames_per_describe = 2
# Ancho máximo antes de mandar al sidecar (aspecto preservado, JPEG): medido
# con el cliente real, 1280 px todavía da timeout (30.01 s) y 1024 px tarda
# ~20 s (896 px ~11 s). Lo que no entra en el cap de ~1.5MB del sidecar se
# descarta con log, nunca se manda.
vision_sidecar_max_width = 1024
device_index = 0
