[kateto]
name = "Kateto"
language = "en"
debug = false
hot_reload = false
log_level = "INFO"

[compiler.whisper]
backend = "vulkan"

[compiler.llama]
backend = "vulkan"

[plugin.audio_input_mic]
enabled = true
sample_rate = 16000
silence_timeout = 1.5
vad_model = "silero"
# Barge-in vs self-bleed (no AEC): VAD inside this window after playback start
# is treated as the speaker bleeding into the mic. Real barge-in must also be
# louder than the smoothed playback level (x barge_in_level_factor) and sustain
# that for barge_in_min_speech_ms. Turn accumulation: consecutive segments
# closer than turn_silence_timeout merge into one audio_chunk (one Whisper
# pass); max_turn_secs caps the turn buffer.
# barge_in_grace_ms = 800.0
# barge_in_level_factor = 1.3
# barge_in_min_speech_ms = 300.0
# turn_silence_timeout = 2.0
# max_turn_secs = 30.0
# turn_hold_ms = 0.0

[plugin.audio_processor_whisper]
enabled = true
# backend = "pywhispercpp" # pywhispercpp | server | http | command
# gpu_device = 1 # whisper.cpp Vulkan device index (see vulkaninfo --summary)
endpoint = "http://127.0.0.1:8090"

[plugin.executor_classifier]
enabled = true
# backend = "mmbert" # mmbert | llamacpp | http | command
model_endpoint = "http://127.0.0.1:8091"
model = "classifier"

[plugin.executor_workflow_router]
enabled = false
model_endpoint = "http://127.0.0.1:8091"
model = "classifier"

[plugin.voice_llm]
enabled = true
endpoint = "http://127.0.0.1:8092/v1"
model = "voice"

[plugin.audio_output_zonos]
enabled = true
endpoint = "http://127.0.0.1:8093"
stream = true

[plugin.audio_output_camb]
enabled = false
endpoint = "https://client.camb.ai/apis"
api_key = ""
model = "mars-8.1-flash-beta"
default_voice_id = 147320
default_language = "en-us"

[plugin.audio_output_edgetts]
enabled = false
default_voice = "es-AR-ElenaNeural"
default_language = "es-AR-ElenaNeural"
stream = true

[plugin.audio_output_boson]
enabled = false
endpoint = "https://api.boson.ai/v1/audio/speech"
api_key = ""
model = "higgs-tts-3"
default_voice = "chloe"

[plugin.audio_output_player]
enabled = true

[voice.jane]
enabled = true
skills = ["orchestrator", "look-at"]
mcp_servers = ["system"]
stream = true
max_tokens = 4096
retries = 2
timeout = 600
# thinking = true  # false → manda reasoning_effort="none" al proveedor
# reasoning_effort = "none"  # none|minimal|low|medium|high (gateway: off|disabled|disable → none)

[voice.doktor]
enabled = true
skills = ["backlog", "risk-analysis", "planning-poker", "look-at"]
mcp_servers = ["system"]
stream = true
max_tokens = 4096
retries = 2
timeout = 600
# thinking = true  # false → manda reasoning_effort="none" al proveedor
# reasoning_effort = "none"  # none|minimal|low|medium|high (gateway: off|disabled|disable → none)

[voice.conquest]
enabled = true
skills = ["backlog", "look-at"]
mcp_servers = ["system"]
stream = true
max_tokens = 4096
retries = 2
timeout = 600
# thinking = true  # false → manda reasoning_effort="none" al proveedor
# reasoning_effort = "none"  # none|minimal|low|medium|high (gateway: off|disabled|disable → none)

[voice.whisperer]
enabled = true
skills = ["orchestrator", "look-at"]
mcp_servers = ["system"]
stream = true
max_tokens = 4096
retries = 2
timeout = 600
# thinking = true  # false → manda reasoning_effort="none" al proveedor
# reasoning_effort = "none"  # none|minimal|low|medium|high (gateway: off|disabled|disable → none)

[mcp_servers.system]
command = "kateto"

# BYO video-rag sidecar for the vision describe fallback chain (plugin-side
# use only — no voice mcp_servers entry). Inherits Kateto's process env.
[mcp_servers.video_rag]
command = "video-rag"
args = ["mcp", "serve"]
# enabled = false

[cli]
allowlist = ["git", "ls", "pwd", "cat", "echo", "date"]

[plugin.executor_interrupt]
enabled = true

[plugin.executor_todo_list]
enabled = true

[plugin.connector_cli]
enabled = true

[plugin.backlog]
enabled = true

[plugin.voice_soul_manager]
enabled = true

[plugin.voice_manager]
enabled = true
voice_probabilities = { jane = 0.7, doktor = 0.15, conquest = 0.1, whisperer = 0.05 }

[plugin.http_server]
enabled = true
host = "127.0.0.1"
port = 8099

[plugin.executor_vision]
enabled = true
source_default = "screen"
window_secs = 5.0
capture_fps = 1.0
describe_interval = "30s"
vision_max_tokens = 300
vision_timeout = 60.0
# Frames por describe: cada frame cuesta ~2350 tokens de visión (~36 s de
# prefill a ~66 tok/s), así que la narración periódica manda 2 (el más viejo
# y el más nuevo). El sidecar usa max(vision_timeout, 120) de timeout.
max_frames_per_describe = 2
# Ancho máximo antes de mandar al sidecar (aspecto preservado, JPEG): medido
# con el cliente real, 1280 px todavía da timeout (30.01 s) y 1024 px tarda
# ~20 s (896 px ~11 s). Lo que no entra en el cap de ~1.5MB del sidecar se
# descarta con log, nunca se manda.
vision_sidecar_max_width = 1024
device_index = 0
